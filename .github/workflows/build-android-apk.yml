name: Build Android APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build:web

      - name: Sync Capacitor Android
        run: |
          cd apps/web
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x apps/web/android/gradlew

      - name: Build APK with Gradle
        run: |
          cd apps/web/android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for distribution
        run: |
          mkdir -p build-output
          cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk build-output/KabadiwalaConnect.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KabadiwalaConnect-Android-APK
          path: build-output/KabadiwalaConnect.apk
          retention-days: 30
